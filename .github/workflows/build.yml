
      - name: Extract Android project ZIP
        run: |
          set -e
          ZIP_FILE="./UrjvantaSolarProject.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: UrjvantaSolarProject.zip not found in repository root."
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found. settings.gradle is missing."
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"